- name: Bootstrap doco-cd to swarm
  hosts: swarm01

  tasks:
    - name: Checkout GitOps repository
      ansible.builtin.git:
        repo: 'https://github.com/xfallme/homelab-swarm.git'
        dest: /tmp/checkout

    - name: Install Python packages for
      ansible.builtin.apt:
        name: python3-jsondiff
        state: present
      become: true

    - name: Deploy doco-cd-updater
      community.docker.docker_stack:
        state: present
        name: doco-cd-updater
        compose:
          - /tmp/checkout/deploy/doco-cd/updater.compose.yaml