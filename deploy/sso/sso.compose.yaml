services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.14.0-distroless
    networks:
      - proxy_network
      - internal
    read_only: true
    user: 1000:1000
    environment:
      TZ: Europe/Vienna
      APP_URL: https://sso.$EXTERNAL_DOMAIN
      ENCRYPTION_KEY: $POCKET_ID_ENCRYPTION_KEY
      TRUST_PROXY: "true"
      MAXMIND_LICENSE_KEY: $POCKET_ID_MAXMIND_GEOLITE_LICENSE_KEY
      PUID: 1000
      PGID: 1000
      UI_CONFIG_DISABLED: "true"
      # POCKET_ID
      APP_NAME: SSO
      HOME_PAGE_URL: /settings/apps
      ALLOW_USER_SIGNUPS: disabled
      ACCENT_COLOR: "#379092"
      # SMTP
      # LDAP
      LDAP_ENABLED: "true"
      LDAP_URL: ldap://lldap:3890
      LDAP_BIND_DN: $POCKET_ID_LDAP_BIND_DN
      LDAP_BIND_PASSWORD: $POCKET_ID_LDAP_BIND_PASSWORD
      LDAP_BASE: $LLDAP_BASE_DN
      LDAP_USER_SEARCH_FILTER: (objectClass=person)
      LDAP_USER_GROUP_SEARCH_FILTER: (objectClass=groupOfNames)
      LDAP_SKIP_CERT_VERIFY: "false"
      LDAP_SOFT_DELETE_USERS: "true"
      LDAP_ATTRIBUTE_USER_UNIQUE_IDENTIFIER: uuid
      LDAP_ATTRIBUTE_USER_USERNAME: uid
      LDAP_ATTRIBUTE_USER_EMAIL: mail
      LDAP_ATTRIBUTE_USER_FIRST_NAME: givenName
      LDAP_ATTRIBUTE_USER_LAST_NAME: sn
      LDAP_ATTRIBUTE_USER_PROFILE_PICTURE: jpegPhoto
      LDAP_ATTRIBUTE_GROUP_MEMBER: member
      LDAP_ATTRIBUTE_GROUP_UNIQUE_IDENTIFIER: uuid
      LDAP_ATTRIBUTE_GROUP_NAME: cn
      LDAP_ADMIN_GROUP_NAME: pocketid_admin
    volumes:
      - /mnt/swarm-data/sso/pocket-id:/app/data
    healthcheck:
      test: [ "CMD", "/app/pocket-id", "healthcheck" ]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    deploy:
      replicas: 1
      labels:
        caddy_1: https://sso.$EXTERNAL_DOMAIN
        caddy_1.reverse_proxy: "{{upstreams 1411}}"

  lldap:
    image: lldap/lldap:v0.6.3-alpine-rootless
    hostname: lldap
    networks:
      - proxy_network
      - internal
    volumes:
      - /mnt/swarm-data/sso/lldap:/data
    environment:
      TZ: Europe/Vienna
      UID: 1000
      GID: 1000
      LLDAP_JWT_SECRET: $LLDAP_JWT_SECRET
      LLDAP_KEY_SEED: $LLDAP_KEY_SEED
      LLDAP_LDAP_BASE_DN: $LLDAP_BASE_DN
      LLDAP_LDAP_USER_PASS: CHANG3_M3 # later changed in the UI, only required for the initial login
      LLDAP_HTTP_URL: https://lldap.$EXTERNAL_DOMAIN
      # SMTP
      LLDAP_SMTP_OPTIONS__ENABLE_PASSWORD_RESET: "true"
      LLDAP_SMTP_OPTIONS__SERVER: smtp.mail.me.com # Apple SMTP server for iCloud managed mail domains
      LLDAP_SMTP_OPTIONS__PORT: 587
      LLDAP_SMTP_OPTIONS__SMTP_ENCRYPTION: STARTTLS
      LLDAP_SMTP_OPTIONS__USER: $SMTP_USER
      LLDAP_SMTP_OPTIONS__PASSWORD: $SMTP_PASSWORD
      LLDAP_SMTP_OPTIONS__FROM: SSO Admin <admin@$EXTERNAL_DOMAIN>
    deploy:
      replicas: 1
      labels:
        caddy_1: https://lldap.$EXTERNAL_DOMAIN
        caddy_1.reverse_proxy: "{{upstreams 17170}}"

  tinyauth:
    image: ghcr.io/tinyauthapp/tinyauth:v5.1.3-distroless
    hostname: tinyauth
    networks:
      - proxy_network
    environment:
      TZ: Europe/Vienna
      TINYAUTH_APPURL: https://tinyauth.$EXTERNAL_DOMAIN
      TINYAUTH_AUTH_TRUSTEDPROXIES: 10.0.2.0/24
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTID: $TINYAUTH_OAUTH_PROVIDER_CLIENTID
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTSECRET: $TINYAUTH_OAUTH_PROVIDER_CLIENTSECRET
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_AUTHURL: https://sso.$EXTERNAL_DOMAIN/authorize
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_TOKENURL: https://sso.$EXTERNAL_DOMAIN/api/oidc/token
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_USERINFOURL: https://sso.$EXTERNAL_DOMAIN/api/oidc/userinfo
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_REDIRECTURL: https://tinyauth.$EXTERNAL_DOMAIN/api/oauth/callback/pocketid
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_SCOPES: openid email profile groups
      TINYAUTH_OAUTH_PROVIDERS_POCKETID_NAME: Pocket ID
    deploy:
      replicas: 1
      labels:
        caddy_1: https://tinyauth.$EXTERNAL_DOMAIN
        caddy_1.reverse_proxy: "{{upstreams 3000}}"

networks:
  proxy_network:
    external: true
  internal:
    driver: overlay