services:
  dozzle:
    image: amir20/dozzle:v10.7.5-alpine
    networks:
      - proxy_network
      - dozzle
    environment:
      DOZZLE_MODE: swarm
      DOZZLE_AUTH_PROVIDER: forward-proxy
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/swarm-data/dozzle/data:/data
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 3s
      timeout: 30s
      retries: 5
      start_period: 30s
    deploy:
      mode: global
      labels:
        caddy: https://dozzle.$EXTERNAL_DOMAIN
        caddy.reverse_proxy: "{{upstreams 8080}}"
        caddy.reverse_proxy.flush_interval: -1
        caddy.import: tinyauth_forwarder *

networks:
  proxy_network:
    external: true
  dozzle:
    driver: overlay